name: CI

on:
  push:
    branches: [ master, Development ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    steps:

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run pylint
        run: |
          pylint CombatCreator5TDAL --exit-zero

      - name: Run tests
        run: python -m pytest -v CombatCreator5TDAL/
